[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smr_integration_tests"
version = "1.0.0"
description = "Integration tests running several Semantic Match Registries and the SMR discovery service together"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sebastian Heppner", email = "mail@s-heppner.com" }]
dependencies = [
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "mypy",
  "pycodestyle",
  "types-requests",
]

# This project only holds tests, there is no package to install
[tool.setuptools]
packages = []
